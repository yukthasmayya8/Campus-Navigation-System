services:
  - type: web
    name: campus-navigation-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm run migrate && npm run seed:superadmin && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: CORS_ORIGINS
        value: https://campus-navigation-system-smvitm.netlify.app
      - key: COOKIE_SECURE
        value: "true"
      - key: STORAGE_DRIVER
        value: local
      - key: PUBLIC_BASE_URL
        value: https://campus-navigation-system-5bj3.onrender.com
      - key: FRONTEND_URL
        value: https://campus-navigation-system-smvitm.netlify.app
      - key: SUPERADMIN_NAME
        value: SMVITM Super Admin
      - key: SUPERADMIN_EMAIL
        value: superadmin@smvitm.ac.in
      - key: SUPERADMIN_PASSWORD
        generateValue: true
      - key: SMTP_URL
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAX_IMAGE_MB
        value: "3"
      - key: DUPLICATE_RADIUS_M
        value: "15"
