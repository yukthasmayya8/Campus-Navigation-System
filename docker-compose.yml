services:
  db:
    image: postgis/postgis:16-3.4
    container_name: campus-nav-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: campus_nav
    ports:
      - "5432:5432"
    volumes:
      - campus_nav_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d campus_nav"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  campus_nav_pgdata:
